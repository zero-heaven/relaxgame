<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mobile Bejeweled Blitz</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    #header {
      width: 92vw;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .stat-box {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #a2d2ff;
    }

    .stat-value {
      font-size: 15px;
      font-weight: bold;
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    button {
      background: #e94560;
      color: white;
      border: none;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(233, 69, 96, 0.4);
    }

    button:active {
      transform: scale(0.95);
    }

    #pause-btn {
      background: #ffbe0b;
      color: #0d1321;
      box-shadow: 0 3px 10px rgba(255, 190, 11, 0.4);
    }

    #sound-btn {
      background: #3a86ff;
      box-shadow: 0 3px 10px rgba(58, 134, 255, 0.4);
    }

    #timer-wrap {
      width: 92vw;
      max-width: 440px;
      height: 10px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 99px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    #timer-bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #2ec4b6, #ffbe0b, #ff4d6d);
      transition: width 0.25s linear;
    }

    #game-container {
      position: relative;
      padding: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }

    canvas {
      display: block;
      border-radius: 10px;
      background: #0d1321;
    }

    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(13, 19, 33, 0.94);
      border-radius: 16px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .modal-overlay h2 {
      margin: 0 0 8px 0;
      font-size: 28px;
      color: #ffbe0b;
    }

    .modal-overlay p {
      margin: 4px 0 16px 0;
      font-size: 16px;
      color: #e2e8f0;
    }

    #pause-overlay h2 {
      color: #3a86ff;
      margin-bottom: 14px;
    }

    #resume-btn {
      background: #2ec4b6;
      font-size: 15px;
      padding: 12px 24px;
      box-shadow: 0 3px 10px rgba(46, 196, 182, 0.4);
    }

    #play-again-btn {
      font-size: 15px;
      padding: 12px 24px;
    }

    #hint-text {
      margin-top: 10px;
      font-size: 12px;
      color: #cbd5e1;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="header">
    <div class="stat-box">
      <span class="stat-label">Score</span>
      <span class="stat-value" id="score">0</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Time</span>
      <span class="stat-value" id="time-text">60s</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Best</span>
      <span class="stat-value" id="best-score">0</span>
    </div>
    <div class="btn-group">
      <button id="pause-btn">Pause</button>
      <button id="sound-btn">SFX: ON</button>
      <button id="reset-btn">New</button>
    </div>
  </div>

  <div id="timer-wrap">
    <div id="timer-bar"></div>
  </div>

  <div id="game-container">
    <canvas id="board"></canvas>

    <div id="overlay" class="modal-overlay">
      <h2>Time's Up!</h2>
      <p id="final-score-text">Final Score: 0</p>
      <button id="play-again-btn">Play Again</button>
    </div>

    <div id="pause-overlay" class="modal-overlay">
      <h2>Game Paused</h2>
      <button id="resume-btn">Resume</button>
    </div>
  </div>

  <div id="hint-text">Drag &amp; drop a gem onto a neighbor (or tap two gems)</div>

  <script>
//game-audio
let audioCtx = null;
let soundEnabled = true;

function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) {
      audioCtx = new AudioContext();
    }
  }
  if (audioCtx && audioCtx.state === "suspended") {
    audioCtx.resume();
  }
}

function playTone(freq, type, duration, delay, gainVal) {
  if (!soundEnabled) return;
  initAudio();
  if (!audioCtx) return;

  const now = audioCtx.currentTime + (delay || 0);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = type || "sine";
  osc.frequency.setValueAtTime(freq, now);

  gain.gain.setValueAtTime(gainVal || 0.12, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now + duration);
}

function playSwapSound() {
  playTone(320, "sine", 0.08, 0, 0.1);
  playTone(440, "sine", 0.08, 0.05, 0.1);
}

function playInvalidSound() {
  playTone(220, "sawtooth", 0.12, 0, 0.08);
  playTone(170, "sawtooth", 0.14, 0.08, 0.08);
}

function playMatchSound(comboLevel) {
  const base = 380 + (comboLevel - 1) * 75;
  playTone(base, "triangle", 0.16, 0, 0.14);
  playTone(base * 1.25, "triangle", 0.18, 0.06, 0.14);
  playTone(base * 1.5, "sine", 0.24, 0.12, 0.12);
}

function playPowerupSound() {
  playTone(520, "square", 0.12, 0, 0.1);
  playTone(780, "square", 0.15, 0.07, 0.1);
  playTone(1040, "sine", 0.28, 0.14, 0.14);
}

function playGameOverSound() {
  playTone(440, "triangle", 0.2, 0, 0.12);
  playTone(370, "triangle", 0.2, 0.18, 0.12);
  playTone(310, "triangle", 0.4, 0.36, 0.12);
}
//game-core
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const timeTextEl = document.getElementById("time-text");
const bestScoreEl = document.getElementById("best-score");
const timerBarEl = document.getElementById("timer-bar");
const overlayEl = document.getElementById("overlay");
const pauseOverlayEl = document.getElementById("pause-overlay");
const finalScoreTextEl = document.getElementById("final-score-text");
const pauseBtn = document.getElementById("pause-btn");
const resumeBtn = document.getElementById("resume-btn");
const resetBtn = document.getElementById("reset-btn");
const playAgainBtn = document.getElementById("play-again-btn");
const soundBtn = document.getElementById("sound-btn");

const ROWS = 8;
const COLS = 8;
//set timer to 60s
const GAME_DURATION = 120;
let TILE_SIZE = 50;

const GEMS = [
  { color: "#ff4d6d", light: "#ff8fa3", shape: "diamond" },
  { color: "#3a86ff", light: "#8ecae6", shape: "circle" },
  { color: "#2ec4b6", light: "#9bf6ff", shape: "emerald" },
  { color: "#ffbe0b", light: "#fde49e", shape: "triangle" },
  { color: "#9b5de5", light: "#d8bbff", shape: "hexagon" },
  { color: "#fb5607", light: "#ffad85", shape: "star" }
];

let grid = [];
let score = 0;
let bestScore = parseInt(localStorage.getItem("bejeweled_best") || "0", 10);
let combo = 1;
let timeLeft = GAME_DURATION;
let timerInterval = null;
let isGameOver = false;
let isPaused = false;
let isAnimating = false;

let selectedTile = null;
let dragTile = null;
let dragStartPos = { x: 0, y: 0 };
let dragCurrentPos = { x: 0, y: 0 };
let isDragging = false;

bestScoreEl.textContent = bestScore;

function resizeBoard() {
  const maxBoardSize = Math.min(window.innerWidth * 0.9, window.innerHeight * 0.64, 424);
  TILE_SIZE = Math.floor(maxBoardSize / COLS);
  const boardPx = TILE_SIZE * COLS;

  const dpr = window.devicePixelRatio || 1;
  canvas.width = boardPx * dpr;
  canvas.height = boardPx * dpr;
  canvas.style.width = boardPx + "px";
  canvas.style.height = boardPx + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timeLeft = GAME_DURATION;
  isGameOver = false;
  isPaused = false;
  if (overlayEl) overlayEl.style.display = "none";
  if (pauseOverlayEl) pauseOverlayEl.style.display = "none";
  if (pauseBtn) pauseBtn.textContent = "Pause";
  updateTimerUI();

  timerInterval = setInterval(function() {
    if (isGameOver || isPaused) return;
    timeLeft--;
    updateTimerUI();

    if (timeLeft <= 0) {
      endGame();
    }
  }, 1000);
}

function togglePause() {
  if (isGameOver) return;
  isPaused = !isPaused;
  dragTile = null;
  isDragging = false;
  selectedTile = null;

  if (isPaused) {
    if (pauseOverlayEl) pauseOverlayEl.style.display = "flex";
    if (pauseBtn) pauseBtn.textContent = "Resume";
  } else {
    if (pauseOverlayEl) pauseOverlayEl.style.display = "none";
    if (pauseBtn) pauseBtn.textContent = "Pause";
  }
}

function updateTimerUI() {
  timeTextEl.textContent = Math.max(0, timeLeft) + "s";
  const pct = Math.max(0, (timeLeft / GAME_DURATION) * 100);
  timerBarEl.style.width = pct + "%";
}

function endGame() {
  isGameOver = true;
  isPaused = false;
  clearInterval(timerInterval);
  playGameOverSound();

  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem("bejeweled_best", String(bestScore));
    bestScoreEl.textContent = bestScore;
  }

  if (pauseOverlayEl) pauseOverlayEl.style.display = "none";
  finalScoreTextEl.textContent = "Final Score: " + score;
  overlayEl.style.display = "flex";
}

function initBoard() {
  score = 0;
  combo = 1;
  selectedTile = null;
  dragTile = null;
  isDragging = false;
  updateUI();
  grid = [];

  for (let r = 0; r < ROWS; r++) {
    grid[r] = [];
    for (let c = 0; c < COLS; c++) {
      let type;
      do {
        type = Math.floor(Math.random() * GEMS.length);
      } while (
        (c >= 2 && grid[r][c - 1].type === type && grid[r][c - 2].type === type) ||
        (r >= 2 && grid[r - 1][c].type === type && grid[r - 2][c].type === type)
      );

      grid[r][c] = {
        type: type,
        x: c * TILE_SIZE,
        y: r * TILE_SIZE,
        scale: 1,
        alpha: 1
      };
    }
  }
  startTimer();
}

function updateUI() {
  scoreEl.textContent = score;
  if (score > bestScore) {
    bestScore = score;
    bestScoreEl.textContent = bestScore;
  }
}

function drawGem(gem, centerX, centerY, size, scale, alpha) {
  if (scale === undefined) scale = 1;
  if (alpha === undefined) alpha = 1;

  const def = GEMS[gem.type];
  const r = (size * 0.38) * scale;
  if (r <= 0) return;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(centerX, centerY);

  ctx.shadowColor = def.color;
  ctx.shadowBlur = 8;
  ctx.fillStyle = def.color;
  ctx.strokeStyle = def.light;
  ctx.lineWidth = 2;

  ctx.beginPath();
  if (def.shape === "circle") {
    ctx.arc(0, 0, r, 0, Math.PI * 2);
  } else if (def.shape === "diamond") {
    ctx.moveTo(0, -r);
    ctx.lineTo(r, 0);
    ctx.lineTo(0, r);
    ctx.lineTo(-r, 0);
    ctx.closePath();
  } else if (def.shape === "emerald") {
    const w = r * 0.85;
    const h = r * 0.95;
    ctx.rect(-w, -h, w * 2, h * 2);
  } else if (def.shape === "triangle") {
    ctx.moveTo(0, -r);
    ctx.lineTo(r * 0.95, r * 0.8);
    ctx.lineTo(-r * 0.95, r * 0.8);
    ctx.closePath();
  } else if (def.shape === "hexagon") {
    for (let i = 0; i < 6; i++) {
      const angle = (Math.PI / 3) * i - Math.PI / 6;
      const px = Math.cos(angle) * r;
      const py = Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
  } else if (def.shape === "star") {
    for (let i = 0; i < 10; i++) {
      const radius = i % 2 === 0 ? r : r * 0.48;
      const angle = (Math.PI / 5) * i - Math.PI / 2;
      const px = Math.cos(angle) * radius;
      const py = Math.sin(angle) * radius;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  ctx.fill();
  ctx.stroke();

  ctx.shadowBlur = 0;
  ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
  ctx.beginPath();
  ctx.arc(-r * 0.28, -r * 0.28, r * 0.22, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      ctx.fillStyle = (r + c) % 2 === 0 ? "rgba(255,255,255,0.03)" : "rgba(255,255,255,0.07)";
      ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);

      if (selectedTile && selectedTile.r === r && selectedTile.c === c) {
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 3;
        ctx.strokeRect(c * TILE_SIZE + 2, r * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4);
      }
    }
  }

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const gem = grid[r][c];
      if (!gem) continue;
      if (isDragging && dragTile && dragTile.r === r && dragTile.c === c) continue;

      drawGem(gem, gem.x + TILE_SIZE / 2, gem.y + TILE_SIZE / 2, TILE_SIZE, gem.scale, gem.alpha);
    }
  }

  if (isDragging && dragTile) {
    const gem = grid[dragTile.r][dragTile.c];
    if (gem) {
      drawGem(gem, dragCurrentPos.x, dragCurrentPos.y, TILE_SIZE, 1.15, 0.95);
    }
  }

  requestAnimationFrame(render);
}

function animateProperty(items, prop, target, duration) {
  return new Promise(function(resolve) {
    const startValues = items.map(function(item) { return item[prop]; });
    const startTime = performance.now();

    function step(now) {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const ease = 1 - (1 - progress) * (1 - progress);

      for (let i = 0; i < items.length; i++) {
        items[i][prop] = startValues[i] + (target[i] - startValues[i]) * ease;
      }

      if (progress < 1) {
        requestAnimationFrame(step);
      } else {
        resolve();
      }
    }
    requestAnimationFrame(step);
  });
}
//game-input
function isAdjacent(a, b) {
  return Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1;
}

async function swapGems(a, b) {
  if (isGameOver || isAnimating || isPaused) return;
  isAnimating = true;
  selectedTile = null;
  playSwapSound();

  const gemA = grid[a.r][a.c];
  const gemB = grid[b.r][b.c];

  grid[a.r][a.c] = gemB;
  grid[b.r][b.c] = gemA;

  await Promise.all([
    animateProperty([gemA, gemB], "x", [b.c * TILE_SIZE, a.c * TILE_SIZE], 170),
    animateProperty([gemA, gemB], "y", [b.r * TILE_SIZE, a.r * TILE_SIZE], 170)
  ]);

  const matches = findMatches();
  if (matches.length > 0) {
    combo = 1;
    await processMatches(matches);
  } else {
    playInvalidSound();
    grid[a.r][a.c] = gemA;
    grid[b.r][b.c] = gemB;

    await Promise.all([
      animateProperty([gemA, gemB], "x", [a.c * TILE_SIZE, b.c * TILE_SIZE], 170),
      animateProperty([gemA, gemB], "y", [a.r * TILE_SIZE, b.r * TILE_SIZE], 170)
    ]);
  }

  isAnimating = false;
}

function findMatches() {
  const matchedSet = new Set();

  for (let r = 0; r < ROWS; r++) {
    let matchLen = 1;
    for (let c = 0; c < COLS; c++) {
      const curr = grid[r][c];
      const next = c < COLS - 1 ? grid[r][c + 1] : null;
      if (curr && next && curr.type === next.type) {
        matchLen++;
      } else {
        if (matchLen >= 3) {
          for (let k = 0; k < matchLen; k++) {
            matchedSet.add(r + "," + (c - k));
          }
        }
        matchLen = 1;
      }
    }
  }

  for (let c = 0; c < COLS; c++) {
    let matchLen = 1;
    for (let r = 0; r < ROWS; r++) {
      const curr = grid[r][c];
      const next = r < ROWS - 1 ? grid[r + 1][c] : null;
      if (curr && next && curr.type === next.type) {
        matchLen++;
      } else {
        if (matchLen >= 3) {
          for (let k = 0; k < matchLen; k++) {
            matchedSet.add((r - k) + "," + c);
          }
        }
        matchLen = 1;
      }
    }
  }

  return Array.from(matchedSet).map(function(coord) {
    const parts = coord.split(",");
    return {
      r: Number(parts.shift()),
      c: Number(parts.shift())
    };
  });
}

function getSafeGemType(r, c) {
  const forbidden = new Set();

  if (c >= 2 && grid[r][c - 1] && grid[r][c - 2] && grid[r][c - 1].type === grid[r][c - 2].type) {
    forbidden.add(grid[r][c - 1].type);
  }
  if (c <= COLS - 3 && grid[r][c + 1] && grid[r][c + 2] && grid[r][c + 1].type === grid[r][c + 2].type) {
    forbidden.add(grid[r][c + 1].type);
  }
  if (c >= 1 && c <= COLS - 2 && grid[r][c - 1] && grid[r][c + 1] && grid[r][c - 1].type === grid[r][c + 1].type) {
    forbidden.add(grid[r][c - 1].type);
  }
  if (r <= ROWS - 3 && grid[r + 1][c] && grid[r + 2][c] && grid[r + 1][c].type === grid[r + 2][c].type) {
    forbidden.add(grid[r + 1][c].type);
  }

  const allowed = [];
  for (let t = 0; t < GEMS.length; t++) {
    if (!forbidden.has(t)) allowed.push(t);
  }
  if (allowed.length === 0) {
    return Math.floor(Math.random() * GEMS.length);
  }
  return allowed[Math.floor(Math.random() * allowed.length)];
}

async function clearAndDrop(cells) {
  score += cells.length * 10 * combo;
  updateUI();

  if (combo >= 2 && !isGameOver) {
    timeLeft = Math.min(GAME_DURATION, timeLeft + 1);
    updateTimerUI();
  }

  const matchedGems = [];
  for (let i = 0; i < cells.length; i++) {
    const gem = grid[cells[i].r][cells[i].c];
    if (gem) matchedGems.push(gem);
  }

  await Promise.all([
    animateProperty(matchedGems, "scale", matchedGems.map(function() { return 0; }), 180),
    animateProperty(matchedGems, "alpha", matchedGems.map(function() { return 0; }), 180)
  ]);

  for (let i = 0; i < cells.length; i++) {
    grid[cells[i].r][cells[i].c] = null;
  }

  const fallingGems = [];
  const targetYs = [];

  for (let c = 0; c < COLS; c++) {
    let emptySpots = 0;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (grid[r][c] === null) {
        emptySpots++;
      } else if (emptySpots > 0) {
        const gem = grid[r][c];
        grid[r + emptySpots][c] = gem;
        grid[r][c] = null;
        fallingGems.push(gem);
        targetYs.push((r + emptySpots) * TILE_SIZE);
      }
    }

    for (let i = 0; i < emptySpots; i++) {
      const targetRow = emptySpots - 1 - i;
      const newGem = {
        type: getSafeGemType(targetRow, c),
        x: c * TILE_SIZE,
        y: -(i + 1) * TILE_SIZE,
        scale: 1,
        alpha: 1
      };
      grid[targetRow][c] = newGem;
      fallingGems.push(newGem);
      targetYs.push(targetRow * TILE_SIZE);
    }
  }

  await animateProperty(fallingGems, "y", targetYs, 240);
}

async function processMatches(initialMatches) {
  let matches = initialMatches || findMatches();
  let cascadeSteps = 0;

  // Limit to at most 2 steps (your move + at most 1 follow-up drop) so it never auto-plays too much
  while (matches.length > 0 && cascadeSteps < 2) {
    cascadeSteps++;
    playMatchSound(combo);
    await clearAndDrop(matches);
    combo++;
    matches = findMatches();
  }
  combo = 1;
}

function getCanvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: e.clientX - rect.left,
    y: e.clientY - rect.top
  };
}

function getTileAt(x, y) {
  const c = Math.floor(x / TILE_SIZE);
  const r = Math.floor(y / TILE_SIZE);
  if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
    return { r: r, c: c };
  }
  return null;
}

canvas.addEventListener("pointerdown", function(e) {
  if (isAnimating || isGameOver || isPaused) return;
  initAudio();
  canvas.setPointerCapture(e.pointerId);

  const pos = getCanvasCoords(e);
  const tile = getTileAt(pos.x, pos.y);
  if (!tile) return;

  dragTile = tile;
  dragStartPos = pos;
  dragCurrentPos = pos;
  isDragging = false;
});

canvas.addEventListener("pointermove", function(e) {
  if (!dragTile || isAnimating || isGameOver || isPaused) return;

  const pos = getCanvasCoords(e);
  const dx = pos.x - dragStartPos.x;
  const dy = pos.y - dragStartPos.y;

  if (Math.hypot(dx, dy) > 8) {
    isDragging = true;
  }

  if (isDragging) {
    const originX = dragTile.c * TILE_SIZE + TILE_SIZE / 2;
    const originY = dragTile.r * TILE_SIZE + TILE_SIZE / 2;
    const clampedDx = Math.max(-TILE_SIZE, Math.min(TILE_SIZE, dx));
    const clampedDy = Math.max(-TILE_SIZE, Math.min(TILE_SIZE, dy));

    dragCurrentPos = {
      x: originX + clampedDx,
      y: originY + clampedDy
    };

    if (Math.abs(dx) > TILE_SIZE * 0.35 || Math.abs(dy) > TILE_SIZE * 0.35) {
      let targetR = dragTile.r;
      let targetC = dragTile.c;

      if (Math.abs(dx) > Math.abs(dy)) {
        targetC += dx > 0 ? 1 : -1;
      } else {
        targetR += dy > 0 ? 1 : -1;
      }

      if (targetR >= 0 && targetR < ROWS && targetC >= 0 && targetC < COLS) {
        const origin = dragTile;
        dragTile = null;
        isDragging = false;
        swapGems(origin, { r: targetR, c: targetC });
      }
    }
  }
});

canvas.addEventListener("pointerup", function() {
  if (!dragTile || isAnimating || isGameOver || isPaused) {
    dragTile = null;
    isDragging = false;
    return;
  }

  if (!isDragging) {
    if (!selectedTile) {
      selectedTile = dragTile;
    } else if (selectedTile.r === dragTile.r && selectedTile.c === dragTile.c) {
      selectedTile = null;
    } else if (isAdjacent(selectedTile, dragTile)) {
      const first = selectedTile;
      selectedTile = null;
      swapGems(first, dragTile);
    } else {
      selectedTile = dragTile;
    }
  }

  dragTile = null;
  isDragging = false;
});

canvas.addEventListener("pointercancel", function() {
  dragTile = null;
  isDragging = false;
});

function bindButton(btn, handler) {
  if (!btn) return;
  btn.addEventListener("pointerup", function(e) {
    e.preventDefault();
    handler();
  });
}

bindButton(pauseBtn, function() {
  togglePause();
});

bindButton(resumeBtn, function() {
  if (isPaused) togglePause();
});

bindButton(soundBtn, function() {
  soundEnabled = !soundEnabled;
  soundBtn.textContent = soundEnabled ? "SFX: ON" : "SFX: OFF";
  if (soundEnabled) initAudio();
});

bindButton(resetBtn, function() {
  if (!isAnimating) initBoard();
});

bindButton(playAgainBtn, function() {
  initBoard();
});

document.addEventListener("visibilitychange", function() {
  if (document.hidden && !isGameOver && !isPaused) {
    togglePause();
  }
});

window.addEventListener("resize", function() {
  resizeBoard();
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (grid[r][c]) {
        grid[r][c].x = c * TILE_SIZE;
        grid[r][c].y = r * TILE_SIZE;
      }
    }
  }
});

resizeBoard();
initBoard();
requestAnimationFrame(render);
  </script>
</body>
</html>
