// =========================================================================
// 4. 12 種立體牌型生成器
// =========================================================================
function generateLayout(name) {
  const coords = [];
  const addRect = (x1, x2, y1, y2, z) => {
    for (let x = x1; x <= x2; x += 2) {
      for (let y = y1; y <= y2; y += 2) {
        coords.push({ x, y, z });
      }
    }
  };

  if (name === "turtle") {
    addRect(2, 22, 0, 12, 0); coords.pop();
    addRect(6, 18, 2, 10, 1); coords.pop();
    addRect(8, 16, 4, 8, 2);  coords.pop();
    coords.push({ x: 0, y: 6, z: 0 }, { x: 24, y: 6, z: 0 });
    coords.push({ x: 11, y: 5, z: 3 }, { x: 13, y: 7, z: 3 });
  } else if (name === "pyramid") {
    addRect(0, 18, 0, 14, 0);
    addRect(2, 16, 2, 12, 1);
    addRect(4, 14, 4, 10, 2);
    addRect(6, 12, 6, 8, 3);
  } else if (name === "fortress") {
    addRect(0, 6, 0, 12, 0);  addRect(0, 6, 2, 10, 1);  addRect(2, 4, 4, 8, 2);
    addRect(14, 20, 0, 12, 0);addRect(14, 20, 2, 10, 1);addRect(16, 18, 4, 8, 2);
    addRect(8, 12, 4, 8, 0);
  } else if (name === "cross") {
    addRect(8, 14, 0, 14, 0);
    addRect(0, 6, 4, 10, 0);
    addRect(16, 22, 4, 10, 0);
    addRect(8, 14, 4, 10, 1);
    addRect(10, 12, 6, 8, 2);
  } else if (name === "bridge") {
    addRect(0, 22, 2, 10, 0);
    addRect(4, 18, 4, 8, 1);
    addRect(8, 14, 4, 8, 2);
    addRect(10, 12, 6, 6, 3);
  } else if (name === "dragon") {
    addRect(0, 4, 2, 8, 0);   addRect(0, 2, 4, 6, 1);
    addRect(6, 10, 4, 10, 0); addRect(6, 10, 6, 8, 1);
    addRect(12, 16, 2, 8, 0); addRect(12, 16, 4, 6, 1);
    addRect(18, 22, 4, 10, 0);addRect(18, 20, 6, 8, 1);
    addRect(24, 26, 2, 6, 0);
  } else if (name === "diamond") {
    addRect(10, 12, 0, 14, 0);
    addRect(6, 16, 2, 12, 0);
    addRect(2, 20, 4, 10, 0);
    addRect(6, 16, 4, 10, 1);
    addRect(8, 14, 6, 8, 2);
  } else if (name === "heart") {
    addRect(2, 8, 0, 6, 0);   addRect(14, 20, 0, 6, 0);
    addRect(0, 22, 2, 8, 0);
    addRect(4, 18, 8, 10, 0);
    addRect(8, 14, 10, 12, 0);
    addRect(10, 12, 12, 14, 0);
    addRect(4, 18, 4, 8, 1);
    addRect(8, 14, 6, 8, 2);
  } else if (name === "arena") {
    addRect(0, 22, 0, 2, 0);  addRect(0, 22, 12, 14, 0);
    addRect(0, 2, 4, 10, 0);  addRect(20, 22, 4, 10, 0);
    addRect(2, 20, 2, 2, 1);  addRect(2, 20, 12, 12, 1);
    addRect(2, 2, 4, 10, 1);  addRect(20, 20, 4, 10, 1);
    addRect(8, 14, 6, 8, 0);  addRect(10, 12, 6, 8, 1);
  } else if (name === "butterfly") {
    addRect(0, 8, 0, 12, 0);  addRect(14, 22, 0, 12, 0);
    addRect(2, 6, 2, 10, 1);  addRect(16, 20, 2, 10, 1);
    addRect(10, 12, 2, 10, 0);addRect(10, 12, 4, 8, 1);
  } else if (name === "crown") {
    addRect(0, 22, 8, 12, 0);
    addRect(0, 4, 2, 6, 0);   addRect(9, 13, 0, 6, 0);  addRect(18, 22, 2, 6, 0);
    addRect(2, 20, 8, 10, 1);
    addRect(10, 12, 2, 4, 1);
  } else if (name === "pagoda") {
    addRect(0, 22, 10, 12, 0);
    addRect(2, 20, 8, 10, 1);
    addRect(4, 18, 6, 8, 2);
    addRect(6, 16, 4, 6, 3);
    addRect(8, 14, 2, 4, 4);
    addRect(10, 12, 0, 2, 5);
  }

  if (coords.length % 2 !== 0) coords.pop();
  return coords;
}

// 5. 遊戲狀態與計時器變數

let lang = "zh";

let elapsedSeconds = 0;
let timerInterval = null;

let isGameOver = false;

function formatTime(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, "0");
  const s = String(sec % 60).padStart(2, "0");
  return `${m}:${s}`;
}

function startTimer() {
  stopTimer();
  timerInterval = setInterval(() => {
    if (!isPaused && !isGameOver) {
      elapsedSeconds++;
      document.getElementById("ui-timer").textContent = `⏱️ ${formatTime(elapsedSeconds)}`;
    }
  }, 1000);
}

function stopTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

function togglePause(forceState) {
  if (isGameOver) return;
  isPaused = typeof forceState === "boolean" ? forceState : !isPaused;
  const overlay = document.getElementById("pause-overlay");
  const btnPause = document.getElementById("btn-pause");
  const dict = I18N[lang];

  if (isPaused) {
    overlay.classList.add("show");
    btnPause.textContent = dict.resume;
    btnPause.classList.add("active-toggle");
  } else {
    overlay.classList.remove("show");
    btnPause.textContent = dict.pause;
    btnPause.classList.remove("active-toggle");
  }
}

// =========================================================================
// 6. 麻將規則與配對檢查
// =========================================================================
function isTileFree(tile) {
  if (tile.removed) return false;
  let blockedTop = false;
  let blockedLeft = false;
  let blockedRight = false;

  for (const other of tiles) {
    if (other.removed || other.id === tile.id) continue;
    if (other.z === tile.z + 1) {
      if (Math.abs(other.x - tile.x) < 2 && Math.abs(other.y - tile.y) < 2) {
        blockedTop = true;
      }
    }
    if (other.z === tile.z && Math.abs(other.y - tile.y) < 2) {
      if (other.x === tile.x - 2) blockedLeft = true;
      if (other.x === tile.x + 2) blockedRight = true;
    }
  }
  return !blockedTop && (!blockedLeft || !blockedRight);
}

function getAvailablePairs() {
  const freeTiles = tiles.filter(t => isTileFree(t));
  const pairs = [];
  for (let i = 0; i < freeTiles.length; i++) {
    for (let j = i + 1; j < freeTiles.length; j++) {
      if (freeTiles[i].char === freeTiles[j].char) {
        pairs.push([freeTiles[i], freeTiles[j]]);
      }
    }
  }
  return pairs;
}

// =========================================================================
// 7. 開新局與洗牌
// =========================================================================
function startGame() {
  document.getElementById("message-box").classList.remove("show");
  document.getElementById("pause-overlay").classList.remove("show");
  selectedTile = null;
  isPaused = false;
  isGameOver = false;
  elapsedSeconds = 0;
  document.getElementById("ui-timer").textContent = "⏱️ 00:00";
  document.getElementById("btn-pause").textContent = I18N[lang].pause;
  document.getElementById("btn-pause").classList.remove("active-toggle");

  const layout = generateLayout(currentPattern);
  const pairCount = layout.length / 2;

  let deck = [];
  for (let i = 0; i < pairCount; i++) {
    const type = TILE_TYPES[i % TILE_TYPES.length];
    deck.push({ ...type }, { ...type });
  }
  deck.sort(() => Math.random() - 0.5);

  tiles = layout.map((pos, idx) => ({
    id: idx,
    x: pos.x,
    y: pos.y,
    z: pos.z,
    char: deck[idx].char,
    color: deck[idx].color,
    removed: false
  }));

  renderBoard();
  startTimer();
}

function shuffleTiles() {
  if (isPaused || isGameOver) return;
  const active = tiles.filter(t => !t.removed);
  const faces = active.map(t => ({ char: t.char, color: t.color }));
  faces.sort(() => Math.random() - 0.5);

  active.forEach((tile, idx) => {
    tile.char = faces[idx].char;
    tile.color = faces[idx].color;
  });

  selectedTile = null;
  document.getElementById("message-box").classList.remove("show");
  renderBoard();
}

// =========================================================================
// 8. 精準置中與自動適應視窗渲染
// =========================================================================
function renderBoard() {
  boardEl.innerHTML = "";
  if (tiles.length === 0) return;

  // 計算整副牌局在單位座標下的精確邊界 (含 Z 軸立體偏移與 3D 底座陰影)
  const zStepX = 0.22; // 相對於半牌寬的比例
  const zStepY = 0.18; // 相對於半牌高的比例

  let minUnitX = Infinity, maxUnitX = -Infinity;
  let minUnitY = Infinity, maxUnitY = -Infinity;

  for (const t of tiles) {
    const ux = t.x + t.z * zStepX;
    const uy = t.y - t.z * zStepY;
    minUnitX = Math.min(minUnitX, ux);
    maxUnitX = Math.max(maxUnitX, ux + 2); // 單張牌寬為 2 單位
    minUnitY = Math.min(minUnitY, uy);
    maxUnitY = Math.max(maxUnitY, uy + 2); // 單張牌高為 2 單位
  }

  // 預留 3D 厚度與選取浮起空間
  const padUnitX = 0.35;
  const padUnitY = 0.35;
  const spanUnitsX = (maxUnitX - minUnitX) + padUnitX;
  const spanUnitsY = (maxUnitY - minUnitY) + padUnitY;

  const availW = mainAreaEl.clientWidth - 24;
  const availH = mainAreaEl.clientHeight - 24;

  // 麻將牌標準長寬比 3 : 4
  const maxUnitW = availW / spanUnitsX;
  const maxUnitH = availH / spanUnitsY;
  const unitX = Math.max(10, Math.min(maxUnitW, maxUnitH * 0.75));
  const unitY = unitX * (4 / 3);

  const tileW = unitX * 2;
  const tileH = unitY * 2;
  const radius = Math.max(4, Math.round(tileW * 0.14));
  const fontSize = Math.floor(tileH * 0.74);
  const d1 = Math.max(1, Math.round(tileW * 0.03));
  const d2 = Math.max(2, Math.round(tileW * 0.06));
  const d3 = Math.max(3, Math.round(tileW * 0.09));
  const d4 = Math.max(4, Math.round(tileW * 0.12));

  const boardW = spanUnitsX * unitX;
  const boardH = spanUnitsY * unitY;
  boardEl.style.width = `${boardW}px`;
  boardEl.style.height = `${boardH}px`;

  // 將 minUnitX, minUnitY 歸零，確保棋盤內容完全對稱置中於 #board 內
  const originX = -minUnitX * unitX + (padUnitX * unitX) * 0.25;
  const originY = -minUnitY * unitY + (padUnitY * unitY) * 0.65;

  const sorted = [...tiles].sort((a, b) => (a.z - b.z) || (a.y - b.y) || (a.x - b.x));

  for (const tile of sorted) {
    if (tile.removed) continue;

    const left = originX + (tile.x + tile.z * zStepX) * unitX;
    const top = originY + (tile.y - tile.z * zStepY) * unitY;

    const el = document.createElement("div");
    el.className = `tile ${tile.color}`;
    el.dataset.id = tile.id;
    el.style.width = `${tileW}px`;
    el.style.height = `${tileH}px`;
    el.style.left = `${left}px`;
    el.style.top = `${top}px`;
    el.style.borderRadius = `${radius}px`;
    el.style.fontSize = `${fontSize}px`;
    el.style.zIndex = tile.z * 100 + tile.y;
    el.style.boxShadow = `
      ${d1}px ${d1}px 0 #d5cfc2,
      ${d2}px ${d2}px 0 #c7c0b0,
      ${d3}px ${d3}px 0 #2e7d32,
      ${d4}px ${d4}px 0 #1b5e20,
      ${d4 + 2}px ${d4 + 4}px ${d4 * 2}px rgba(0, 0, 0, 0.45)
    `;

    if (!isTileFree(tile)) el.classList.add("blocked");
    if (selectedTile && selectedTile.id === tile.id) el.classList.add("selected");

    const span = document.createElement("span");
    span.textContent = tile.char;
    el.appendChild(span);

    el.addEventListener("click", () => handleTileClick(tile));
    boardEl.appendChild(el);
  }

  updateStats();
}

function handleTileClick(tile) {
  if (isPaused || isGameOver || !isTileFree(tile)) return;

  if (!selectedTile) {
    selectedTile = tile;
    renderBoard();
    return;
  }

  if (selectedTile.id === tile.id) {
    selectedTile = null;
    renderBoard();
    return;
  }

  if (selectedTile.char === tile.char) {
    selectedTile.removed = true;
    tile.removed = true;
    selectedTile = null;
    renderBoard();
    checkGameStatus();
  } else {
    selectedTile = tile;
    renderBoard();
  }
}

function updateStats() {
  const remaining = tiles.filter(t => !t.removed).length;
  const pairs = getAvailablePairs().length;
  const dict = I18N[lang];

  document.getElementById("ui-tiles").textContent = `${dict.tiles}: ${remaining}`;
  document.getElementById("ui-moves").textContent = `${dict.moves}: ${pairs}`;
}

function checkGameStatus() {
  const remaining = tiles.filter(t => !t.removed).length;
  const pairs = getAvailablePairs().length;
  const dict = I18N[lang];
  const modal = document.getElementById("message-box");

  if (remaining === 0) {
    isGameOver = true;
    stopTimer();
    document.getElementById("modal-title").textContent = dict.winTitle;
    document.getElementById("modal-desc").textContent = `${dict.winDesc}${formatTime(elapsedSeconds)}`;
    modal.classList.add("show");
  } else if (pairs === 0) {
    isGameOver = true;
    stopTimer();
    document.getElementById("modal-title").textContent = dict.loseTitle;
    document.getElementById("modal-desc").textContent = `${dict.loseDesc}${formatTime(elapsedSeconds)}`;
    modal.classList.add("show");
  }
}

function showHint() {
  if (isPaused || isGameOver) return;
  const pairs = getAvailablePairs();
  if (pairs.length === 0) return;

  const [t1, t2] = pairs[0];
  document.querySelectorAll(".tile").forEach(el => {
    const id = Number(el.dataset.id);
    if (id === t1.id || id === t2.id) {
      el.classList.add("hint");
    }
  });
}

// =========================================================================
// 9. 音樂播放器系統 (支援預設 music/ 歌單、資料夾匯入、單曲循環 / 隨機播放)
// =========================================================================
let playlist = [...DEFAULT_MUSIC_LIST];
let currentTrackIndex = 0;
let bgmPlaying = false;
let playMode = "loop"; // "loop" | "random"
let audioCtx = null;
let synthTimer = null;

const bgmAudio = document.getElementById("bgm-audio");
const trackSelect = document.getElementById("track-select");
const folderInput = document.getElementById("folder-input");

function populateTrackSelect() {
  trackSelect.innerHTML = "";
  playlist.forEach((item, idx) => {
    const opt = document.createElement("option");
    opt.value = idx;
    opt.textContent = lang === "zh" ? item.titleZh : item.titleEn;
    if (idx === currentTrackIndex) opt.selected = true;
    trackSelect.appendChild(opt);
  });
}

function startSynthMusic() {
  stopSynthMusic();
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 440.00, 392.00];
  let step = 0;

  const playNote = () => {
    if (!bgmPlaying) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = notes[step % notes.length];
    gain.gain.setValueAtTime(0.035, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.35);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 1.4);
    step++;
  };

  playNote();
  synthTimer = setInterval(() => {
    if (playMode === "random") {
      step = Math.floor(Math.random() * notes.length);
    }
    playNote();
  }, 1150);
}

function stopSynthMusic() {
  if (synthTimer) {
    clearInterval(synthTimer);
    synthTimer = null;
  }
}

function playCurrentTrack() {
  stopSynthMusic();
  bgmAudio.pause();

  const track = playlist[currentTrackIndex];
  if (!track) return;

  bgmAudio.loop = (playMode === "loop");
  bgmAudio.volume = 0.45;

  if (track.isSynth || !track.src) {
    if (bgmPlaying) startSynthMusic();
    return;
  }

  bgmAudio.src = track.src;
  if (bgmPlaying) {
    bgmAudio.play().catch(() => {
      // 若同目錄 music/ 資料夾尚無該檔案，自動回退至內建五聲音階合成樂
      startSynthMusic();
    });
  }
}

function playNextRandomTrack() {
  if (playlist.length <= 1) {
    playCurrentTrack();
    return;
  }
  let nextIdx = currentTrackIndex;
  while (nextIdx === currentTrackIndex) {
    nextIdx = Math.floor(Math.random() * playlist.length);
  }
  currentTrackIndex = nextIdx;
  trackSelect.value = currentTrackIndex;
  playCurrentTrack();
}

bgmAudio.addEventListener("ended", () => {
  if (!bgmPlaying) return;
  if (playMode === "random") {
    playNextRandomTrack();
  } else {
    bgmAudio.currentTime = 0;
    bgmAudio.play();
  }
});

// 若預設 music/bgm1.mp3 不存在，自動切換為內建合成樂避免靜音
bgmAudio.addEventListener("error", () => {
  if (bgmPlaying) {
    startSynthMusic();
  }
});

function updateMusicUI() {
  const dict = I18N[lang];
  const btnBgm = document.getElementById("btn-bgm");
  const btnMode = document.getElementById("btn-playmode");

  btnBgm.textContent = bgmPlaying ? dict.bgmOn : dict.bgmOff;
  if (bgmPlaying) btnBgm.classList.add("active-toggle");
  else btnBgm.classList.remove("active-toggle");

  btnMode.textContent = playMode === "loop" ? dict.modeLoop : dict.modeRandom;
  document.getElementById("btn-folder").textContent = dict.loadFolder;
  populateTrackSelect();
}

document.getElementById("btn-bgm").addEventListener("click", () => {
  bgmPlaying = !bgmPlaying;
  if (bgmPlaying) {
    playCurrentTrack();
  } else {
    bgmAudio.pause();
    stopSynthMusic();
  }
  updateMusicUI();
});

trackSelect.addEventListener("change", (e) => {
  currentTrackIndex = Number(e.target.value);
  if (!bgmPlaying) bgmPlaying = true;
  playCurrentTrack();
  updateMusicUI();
});

document.getElementById("btn-playmode").addEventListener("click", () => {
  playMode = playMode === "loop" ? "random" : "loop";
  bgmAudio.loop = (playMode === "loop");
  updateMusicUI();
});

document.getElementById("btn-folder").addEventListener("click", () => {
  folderInput.click();
});

folderInput.addEventListener("change", (e) => {
  const files = Array.from(e.target.files).filter(f => f.type.startsWith("audio/") || /\.(mp3|wav|ogg|m4a|flac)$/i.test(f.name));
  if (files.length === 0) return;

  files.sort((a, b) => a.name.localeCompare(b.name));
  playlist = files.map(file => ({
    titleZh: `🎵 ${file.name}`,
    titleEn: `🎵 ${file.name}`,
    src: URL.createObjectURL(file),
    isSynth: false
  }));

  currentTrackIndex = 0;
  bgmPlaying = true;
  updateMusicUI();
  playCurrentTrack();
});

// =========================================================================
// 10. 雙語界面更新與事件綁定
// =========================================================================
function updateLanguage() {
  const dict = I18N[lang];
  document.getElementById("ui-title").textContent = dict.title;
  document.getElementById("ui-pattern-label").textContent = dict.patternLabel;
  document.getElementById("ui-bg-label").textContent = dict.bgLabel;
  document.getElementById("btn-hint").textContent = dict.hint;
  document.getElementById("btn-shuffle").textContent = dict.shuffle;
  document.getElementById("btn-pause").textContent = isPaused ? dict.resume : dict.pause;
  document.getElementById("btn-new").textContent = dict.newGame;
  document.getElementById("btn-lang").textContent = dict.langBtn;

  document.getElementById("pause-title").textContent = dict.pauseTitle;
  document.getElementById("pause-desc").textContent = dict.pauseDesc;
  document.getElementById("btn-resume").textContent = dict.resumeBtn;
  document.getElementById("modal-btn").textContent = dict.playAgain;

  patternSelect.innerHTML = "";
  for (const [key, label] of Object.entries(dict.patterns)) {
    const opt = document.createElement("option");
    opt.value = key;
    opt.textContent = label;
    if (key === currentPattern) opt.selected = true;
    patternSelect.appendChild(opt);
  }

  bgSelect.innerHTML = "";
  for (const [key, label] of Object.entries(dict.backgrounds)) {
    const opt = document.createElement("option");
    opt.value = key;
    opt.textContent = label;
    if (key === currentBg) opt.selected = true;
    bgSelect.appendChild(opt);
  }

  updateMusicUI();
  updateStats();
}

patternSelect.addEventListener("change", (e) => {
  currentPattern = e.target.value;
  startGame();
});

bgSelect.addEventListener("change", (e) => {
  currentBg = e.target.value;
  document.body.className = currentBg;
});

document.getElementById("btn-hint").addEventListener("click", showHint);
document.getElementById("btn-shuffle").addEventListener("click", shuffleTiles);
document.getElementById("btn-pause").addEventListener("click", () => togglePause());
document.getElementById("btn-resume").addEventListener("click", () => togglePause(false));
document.getElementById("btn-new").addEventListener("click", startGame);
document.getElementById("modal-btn").addEventListener("click", startGame);

document.getElementById("btn-lang").addEventListener("click", () => {
  lang = lang === "zh" ? "en" : "zh";
  updateLanguage();
});

window.addEventListener("resize", () => {
  renderBoard();
});

// 啟動遊戲
updateLanguage();
startGame();
</script>
